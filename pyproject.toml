[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "datumline-agent-guard"
version = "0.1.0"
description = "Independent verifier for AI agent completion claims: VERIFIED, FAILED, FALSE_DONE or UNVERIFIABLE."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Datumline LLC"}]
requires-python = ">=3.9"
dependencies = []
keywords = ["agents", "verification", "governance", "audit", "llm"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3; python_version>='3.10'"]

[project.urls]
Repository = "https://github.com/datumline/datumline-agent-guard"

[project.scripts]
agent-guard = "datumline_agent_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
